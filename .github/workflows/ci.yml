name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      THEBES_RABBITMQ_URI: amqp://localhost:5672
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
      - name: Lint
        run: clojure -M:lint
      - name: Test
        run: clojure -M:test
      - name: Demo
        run: clojure -M:demo --plain --rate 720
      - name: Demo over RabbitMQ
        run: clojure -M:demo --plain --rate 720 --transport rabbitmq
